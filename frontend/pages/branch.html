<div class="content">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold class-card-title">Chi nhánh</h2>
            <p class="text-muted mb-0">Quản lý các chi nhánh</p>
        </div>
        <button class="btn btn-create-modern" id="btn-open-create-branch">
            <i class="fa-solid fa-plus me-2"></i>Tạo chi nhánh mới
        </button>
    </div>

    <!-- Filter Card -->
    <div class="card stat-card-box p-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label text-muted filter-label mb-1" style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px;">TÌM KIẾM</label>
                <input type="text" id="branch-filter-search" class="form-control"
                    placeholder="Tên, địa chỉ, điện thoại..."
                    style="border-radius: 8px; border-color: #E0E5F2; font-size: 14px;">
            </div>
            <div class="col-md-3">
                <label class="form-label text-muted filter-label mb-1" style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px;">SẮP XẾP</label>
                <select id="branch-filter-sort" class="form-select shadow-sm">
                    <option value="az">Tên (A→Z)</option>
                    <option value="za">Tên (Z→A)</option>
                    <option value="newest">Mới nhất</option>
                    <option value="oldest">Cũ nhất</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label text-muted filter-label mb-1" style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px;">#</label>
                <select id="branch-filter-page-size" class="form-select shadow-sm">
                    <option value="12" selected>12 mục</option>
                    <option value="24">24 mục</option>
                    <option value="9999">Tất cả</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="branch-btn-reset-filter" class="btn w-100 py-2"
                    style="border: 1.5px solid var(--primary-color); color: var(--primary-color); border-radius: 8px; font-weight: 500; font-size: 14px; background: transparent;">
                    Đặt lại lọc
                </button>
            </div>
        </div>
    </div>

    <!-- Count text -->
    <div class="mb-3">
        <span id="branch-count-text" class="text-muted fw-medium class-count-text">Đang tải...</span>
    </div>

    <!-- Branch Card Grid -->
    <div class="row g-4" id="branch-list-container">
        <div class="col-12 text-center py-5 text-muted">Đang tải dữ liệu...</div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4">
        <div id="branch-pagination-controls" class="d-flex align-items-center gap-2"></div>
    </div>
</div>

<!-- ===== MODAL TẠO CHI NHÁNH MỚI ===== -->
<div class="modal fade" id="createBranchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
        <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
            <div class="modal-header" style="border-bottom: 1px solid #f0f0f5; padding: 20px 24px;">
                <h5 class="modal-title fw-bold" style="color: #1a202c; font-size: 18px;">
                    <i class="fa-solid fa-building me-2" style="color: #f97316;"></i>Tạo chi nhánh mới
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding: 24px;">
                <form id="createBranchForm">
                    <div class="mb-3">
                        <label class="form-label user-form-label">Tên chi nhánh <span class="text-danger">*</span></label>
                        <input type="text" id="newBranchName" class="form-control user-form-input" placeholder="Nhập tên chi nhánh">
                    </div>
                    <div class="mb-3">
                        <label class="form-label user-form-label">Địa chỉ</label>
                        <input type="text" id="newBranchAddress" class="form-control user-form-input" placeholder="Nhập địa chỉ">
                    </div>
                    <div class="mb-3">
                        <label class="form-label user-form-label">Số điện thoại</label>
                        <input type="text" id="newBranchPhone" class="form-control user-form-input" placeholder="Nhập số điện thoại">
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #f0f0f5; padding: 16px 24px; gap: 10px;">
                <button type="button" class="btn btn-modal-cancel px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" id="btnSubmitCreateBranch" class="btn text-white px-5 fw-semibold"
                    style="background: linear-gradient(135deg, #f97316, #fb923c); border: none; border-radius: 8px;">
                    <i class="fa-solid fa-plus me-1"></i>Tạo mới
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== MODAL SỬA CHI NHÁNH ===== -->
<div class="modal fade" id="editBranchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 480px;">
        <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
            <div class="modal-header" style="border-bottom: 1px solid #f0f0f5; padding: 20px 24px;">
                <h5 class="modal-title fw-bold" style="color: #1a202c; font-size: 18px;">
                    <i class="fa-solid fa-pen-to-square me-2" style="color: #7B4BEF;"></i>Sửa chi nhánh
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding: 24px;">
                <form id="editBranchForm">
                    <input type="hidden" id="editBranchId">
                    <div class="mb-3">
                        <label class="form-label user-form-label">Tên chi nhánh <span class="text-danger">*</span></label>
                        <input type="text" id="editBranchName" class="form-control user-form-input">
                    </div>
                    <div class="mb-3">
                        <label class="form-label user-form-label">Địa chỉ</label>
                        <input type="text" id="editBranchAddress" class="form-control user-form-input">
                    </div>
                    <div class="mb-3">
                        <label class="form-label user-form-label">Số điện thoại</label>
                        <input type="text" id="editBranchPhone" class="form-control user-form-input">
                    </div>
                </form>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #f0f0f5; padding: 16px 24px; gap: 10px;">
                <button type="button" class="btn btn-modal-cancel px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" id="btnSubmitEditBranch" class="btn text-white px-5 fw-semibold"
                    style="background: linear-gradient(135deg, #7B4BEF, #9d73f5); border: none; border-radius: 8px;">
                    <i class="fa-solid fa-check me-1"></i>Lưu thay đổi
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== MODAL XÁC NHẬN XÓA ===== -->
<div class="modal fade" id="deleteBranchModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <div class="modal-content" style="border-radius: 14px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.15);">
            <div class="modal-header" style="border-bottom: 1px solid #f0f0f5; padding: 20px 24px;">
                <h5 class="modal-title fw-bold" style="color: #1a202c;">
                    <i class="fa-solid fa-triangle-exclamation me-2 text-danger"></i>Xóa chi nhánh
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="padding: 20px 24px;">
                <p id="deleteBranchMessage" class="mb-0" style="color: #4a5568; font-size: 15px; line-height: 1.6;">
                    Bạn có chắc chắn muốn xóa chi nhánh này?
                </p>
            </div>
            <div class="modal-footer" style="border-top: none; padding: 0 24px 24px; gap: 10px;">
                <button type="button" class="btn btn-modal-cancel px-4" data-bs-dismiss="modal">Hủy</button>
                <button type="button" id="btnConfirmDeleteBranch" class="btn text-white px-4"
                    style="border-radius: 8px; background: #e53e3e; font-weight: 500;">Xóa</button>
            </div>
        </div>
    </div>
</div>
