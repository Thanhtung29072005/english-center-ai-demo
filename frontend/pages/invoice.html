<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hóa Đơn Học Phí</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .invoice-container {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .invoice-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2.5rem;
            text-align: center;
        }

        .invoice-logo {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .invoice-subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .invoice-body {
            padding: 2.5rem;
        }

        .invoice-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #f1f5f9;
        }

        .invoice-meta-item h3 {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
        }

        .invoice-meta-item p {
            font-size: 1rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .invoice-meta-item strong {
            font-weight: 600;
        }

        .invoice-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .invoice-table {
            width: 100%;
            margin-bottom: 2rem;
            border-collapse: collapse;
        }

        .invoice-table thead {
            background: linear-gradient(to bottom, #f8fafc, #f1f5f9);
        }

        .invoice-table th {
            padding: 1rem;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        .invoice-table td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        .invoice-table tbody tr:hover {
            background: #fafbfc;
        }

        .invoice-total {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .invoice-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .invoice-total-row:last-child {
            margin-bottom: 0;
            padding-top: 0.75rem;
            border-top: 2px solid #86efac;
        }

        .invoice-total-label {
            font-size: 1rem;
            color: #059669;
            font-weight: 500;
        }

        .invoice-total-value {
            font-size: 1rem;
            color: #059669;
            font-weight: 600;
        }

        .invoice-total-row:last-child .invoice-total-label {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .invoice-total-row:last-child .invoice-total-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .invoice-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #059669;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .invoice-footer {
            background: #f8fafc;
            padding: 2rem;
            text-align: center;
            border-top: 2px solid #f1f5f9;
        }

        .invoice-footer p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .invoice-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .invoice-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .invoice-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .invoice-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .invoice-btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .invoice-btn-secondary:hover {
            background: #f8fafc;
        }

        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f1f5f9;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .invoice-actions {
                display: none;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .invoice-meta {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .invoice-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="invoice-header">
            <div class="invoice-logo">QLDT</div>
            <div class="invoice-subtitle">Hệ thống Quản lý Đào tạo</div>
        </div>

        <div class="invoice-body" id="invoiceContent">
            <div class="loading-state">
                <div class="spinner"></div>
                <p style="color: #64748b;">Đang tải hóa đơn...</p>
            </div>
        </div>

        <div class="invoice-footer">
            <p><strong>Cảm ơn bạn đã tin tưởng dịch vụ của chúng tôi!</strong></p>
            <p>Mọi thắc mắc vui lòng liên hệ: <strong>support@qldt.vn</strong> | <strong>1900-xxxx</strong></p>
            
            <div class="invoice-actions">
                <button class="invoice-btn invoice-btn-primary" onclick="window.print()">
                    <i class="fa-solid fa-print"></i>
                    <span>In hóa đơn</span>
                </button>
                <button class="invoice-btn invoice-btn-secondary" onclick="window.close()">
                    <i class="fa-solid fa-xmark"></i>
                    <span>Đóng</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/invoice.js"></script>
</body>
</html>
