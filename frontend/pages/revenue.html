<div class="revenue-page">
    <!-- Header Section -->
    <div class="revenue-header mb-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div>
                <h4 class="fw-bold mb-1" style="color:#1e293b;">
                    <i class="fa-solid fa-chart-line me-2" style="color:#10b981;"></i>Báo Cáo Lợi Nhuận
                </h4>
                <p class="text-muted mb-0" style="font-size:0.92rem;">Tổng hợp doanh thu theo lớp học và chi nhánh</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <!-- Scope Badge: được gắn từ JS theo role -->
                <div id="revenue-scope-badge"></div>
                <button class="btn btn-sm d-flex align-items-center gap-2" id="btnRefreshRevenue"
                    style="background:linear-gradient(135deg,#10b981,#34d399);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-weight:600;">
                    <i class="fa-solid fa-rotate-right"></i> Làm mới
                </button>
            </div>
        </div>
    </div>

    <!-- Scope Banner: thông báo phạm vi dữ liệu -->
    <div id="revenue-scope-banner" class="mb-4" style="display:none;"></div>

    <!-- Overview Cards -->
    <div class="row g-4 mb-4" id="revenue-overview-cards">
        <div class="col-xl-4 col-md-6">
            <div class="card border-0 h-100" style="border-radius:16px;box-shadow:0 4px 20px rgba(16,185,129,.15);">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#10b981,#34d399);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <i class="fa-solid fa-money-bill-wave text-white fs-4"></i>
                    </div>
                    <div>
                        <div id="stat-total-revenue-label" class="text-muted mb-1" style="font-size:0.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Tổng Doanh Thu</div>
                        <div id="stat-total-revenue" class="fw-bold" style="font-size:1.5rem;color:#10b981;">—</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-4 col-md-6">
            <div class="card border-0 h-100" style="border-radius:16px;box-shadow:0 4px 20px rgba(99,102,241,.15);">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#818cf8);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <i class="fa-regular fa-building text-white fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted mb-1" style="font-size:0.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Số Chi Nhánh</div>
                        <div id="stat-branch-count" class="fw-bold" style="font-size:1.5rem;color:#6366f1;">—</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-4 col-md-6">
            <div class="card border-0 h-100" style="border-radius:16px;box-shadow:0 4px 20px rgba(245,158,11,.15);">
                <div class="card-body d-flex align-items-center gap-3 p-4">
                    <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#fbbf24);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <i class="fa-solid fa-users text-white fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted mb-1" style="font-size:0.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Tổng Học Sinh</div>
                        <div id="stat-total-students" class="fw-bold" style="font-size:1.5rem;color:#f59e0b;">—</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-4 mb-4">
        <div class="col-xl-5">
            <div class="card border-0 h-100" style="border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3" style="color:#334155;">
                        <i class="fa-solid fa-chart-pie me-2" style="color:#6366f1;"></i>Tỷ Lệ Doanh Thu Theo Chi Nhánh
                    </h6>
                    <div style="position:relative;height:240px;">
                        <canvas id="revenueByBranchChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-7">
            <div class="card border-0 h-100" style="border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3" style="color:#334155;">
                        <i class="fa-solid fa-chart-bar me-2" style="color:#10b981;"></i>Doanh Thu Từng Chi Nhánh
                    </h6>
                    <div style="position:relative;height:240px;">
                        <canvas id="revenueBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Branch Revenue Accordion -->
    <div class="card border-0" style="border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);">
        <div class="card-header bg-white border-0 pt-4 px-4 pb-2">
            <h6 class="fw-bold mb-0" style="color:#334155;">
                <i class="fa-solid fa-table me-2" style="color:#f59e0b;"></i>Chi Tiết Doanh Thu Từng Lớp Học
            </h6>
        </div>
        <div class="card-body p-4">
            <div id="revenue-accordion" class="d-flex flex-column gap-3"></div>
            <div id="revenue-loading" class="text-center py-5 text-muted">
                <div class="spinner-border text-success mb-3" role="status"></div>
                <div>Đang tải dữ liệu...</div>
            </div>
            <div id="revenue-empty" class="text-center py-5 text-muted" style="display:none;">
                <i class="fa-solid fa-chart-line fa-3x mb-3 text-light"></i>
                <div>Chưa có dữ liệu doanh thu. Vui lòng thiết lập học phí cho các lớp học.</div>
            </div>
        </div>
    </div>
</div>
