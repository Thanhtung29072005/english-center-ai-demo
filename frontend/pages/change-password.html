<div class="content change-password-page" style="width: 100%; max-width: 920px; margin: 0 auto;">
    <div class="mb-4">
        <button id="change-password-btn-back" class="btn px-4 py-2"
            style="border: 1.5px solid var(--primary-color); color: var(--primary-color); border-radius: 8px; font-weight: 600; font-size: 14px; background: transparent;">
            <i class="fa-solid fa-arrow-left me-2"></i>Quay lại
        </button>
    </div>

    <div class="d-flex align-items-center gap-3 mb-5">
        <div class="d-flex align-items-center justify-content-center"
            style="width: 52px; height: 52px; border-radius: 8px; background: rgba(123,75,239,0.12); color: #7B4BEF; flex-shrink: 0;">
            <i class="fa-solid fa-key" style="font-size: 24px;"></i>
        </div>
        <div>
            <h2 class="fw-bold mb-2" style="font-size: 32px; color: #001a3d;">Đổi mật khẩu</h2>
            <p class="mb-0" style="font-size: 16px; color: #001a3d;">Thay đổi mật khẩu để bảo vệ tài khoản của bạn</p>
        </div>
    </div>

    <div class="card stat-card-box p-4 p-md-5" style="border-radius: 8px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);">
        <form id="changePasswordForm">
            <div class="mb-4">
                <label class="form-label user-form-label">Mật khẩu hiện tại</label>
                <input type="password" id="change-current-password" class="form-control user-form-input"
                    autocomplete="current-password">
            </div>

            <div class="mb-4">
                <label class="form-label user-form-label">Mật khẩu mới</label>
                <input type="password" id="change-new-password" class="form-control user-form-input"
                    autocomplete="new-password">
                <div class="form-text" style="font-size: 12px; color: #001a3d;">Mật khẩu phải có ít nhất 6 ký tự</div>
            </div>

            <div class="mb-5">
                <label class="form-label user-form-label">Xác nhận mật khẩu mới</label>
                <input type="password" id="change-confirm-password" class="form-control user-form-input"
                    autocomplete="new-password">
            </div>

            <div class="d-flex gap-3 flex-wrap">
                <button type="button" id="change-password-btn-submit" class="btn text-white px-4 py-2 fw-semibold"
                    style="background: linear-gradient(135deg, #f97316, #fb923c); border: none; border-radius: 8px; font-size: 15px;">
                    Đổi mật khẩu
                </button>
                <button type="button" id="change-password-btn-cancel" class="btn px-4 py-2 fw-semibold"
                    style="border: 1.5px solid var(--primary-color); color: var(--primary-color); border-radius: 8px; font-size: 15px; background: transparent;">
                    Hủy
                </button>
            </div>
        </form>
    </div>
</div>
